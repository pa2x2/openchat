name: release-android

# A push to main releases the version in package.json once CHANGELOG.md has notes for it and no
# tag holds it yet. The release is a draft, to try the APKs before anyone is offered them, and
# its commit is tagged along with it.
#
# A version without notes is left alone. That is how an OpenCode bump reaches main, and
# release-opencode-bump.yml releases it.

on:
  push:
    branches:
      - main
  # A release that is published as soon as it is built, from `ref` and with `notes` as its text.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      notes:
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  HUSKY: "0"
  REACT_NATIVE_ARCHITECTURES: arm64-v8a,armeabi-v7a

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      # Empty when there is nothing to release, which skips the release job.
      tag: ${{ steps.release.outputs.tag }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # Full history and tags, to find this version's tag and compare versionCode with
          # earlier releases.
          fetch-depth: 0

      - name: Decide what to release
        id: release
        env:
          CALLED_REF: ${{ inputs.ref }}
          CALLED_NOTES: ${{ inputs.notes }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version $VERSION is not semver X.Y.Z or X.Y.Z-prerelease"
            exit 1
          fi
          if git rev-parse --quiet --verify "refs/tags/$TAG" > /dev/null; then
            if [ -n "$CALLED_REF" ]; then
              echo "::error::$TAG is already released"
              exit 1
            fi
            echo "::notice::$TAG is already released."
            exit 0
          fi
          if [ -n "$CALLED_REF" ]; then
            NOTES="$CALLED_NOTES"
          else
            # The version's section without its heading: the release is already named after it.
            NOTES=$(awk -v heading="## [$VERSION]" '
              /^## \[/ { inside = index($0, heading) == 1; next }
              inside && (seen || NF) { seen = 1; print }
            ' CHANGELOG.md)
            if [ -z "$NOTES" ]; then
              echo "::notice::CHANGELOG.md has no notes for $VERSION, so this push releases nothing."
              exit 0
            fi
          fi
          {
            echo "tag=$TAG"
            echo "notes<<END_OF_NOTES"
            echo "$NOTES"
            echo "END_OF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Check versionCode increased
        if: steps.release.outputs.tag
        run: |
          version_code() {
            git show "$1:package.json" 2>/dev/null | node -e '
              let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
                try { console.log(JSON.parse(s).versionCode ?? 0); } catch { console.log(0); }
              });'
          }
          CURRENT=$(node -p "require('./package.json').versionCode")
          if ! echo "$CURRENT" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::package.json versionCode must be a positive integer, got $CURRENT"
            exit 1
          fi
          for TAG in $(git tag --list 'v*'); do
            PREVIOUS=$(version_code "$TAG")
            if [ "$PREVIOUS" -ge "$CURRENT" ]; then
              echo "::error::versionCode $CURRENT must be greater than $PREVIOUS from $TAG"
              exit 1
            fi
          done
          echo "versionCode $CURRENT"

  release:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: temurin

      # Saved, as for any run on main. Builds on upcoming cannot save a Gradle cache of their own
      # and start from this one.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: android
          evict-old-files: job

      # For the reason given in build.yml.
      - name: Identify the compiler to ccache by its version
        run: ccache --set-config "compiler_check=%compiler% --version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint and test
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Decode signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for NAME in SIGNING_KEY KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [ -z "${!NAME}" ]; then
              echo "::error::Repository secret $NAME is not set"
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Generate native project
        run: pnpm exec expo prebuild --platform android --clean --no-install

      # Keep the flags and launcher env in sync with build.yml, or builds on upcoming miss the
      # Gradle cache this one leaves on main.
      - name: Build
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -PreactNativeArchitectures="$REACT_NATIVE_ARCHITECTURES"
          -PreactNativeDevServerIp=localhost
          -x lintVitalRelease

      - name: Rename APKs and verify signatures
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -e
          OUT=android/app/build/outputs/apk/release
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"

          mv "$OUT/app-universal-release.apk" "openchat-$TAG.apk"
          for APK in "$OUT"/app-*-release.apk; do
            ABI="$(basename "$APK" -release.apk)"
            mv "$APK" "openchat-${ABI#app-}-$TAG.apk"
          done

          for APK in openchat-*.apk; do
            CERTS=$("$APKSIGNER" verify --print-certs "$APK")
            if echo "$CERTS" | grep -q "CN=Android Debug"; then
              echo "::error::$APK is signed with the debug key"
              exit 1
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: ${{ needs.plan.outputs.tag }}
          # The commit GitHub tags on publishing, when the tag is not there yet.
          target_commitish: ${{ inputs.ref || github.sha }}
          body: |
            ${{ needs.plan.outputs.notes }}

            > [!TIP]
            >
            > If you are unsure which version to download, use `openchat-${{ needs.plan.outputs.tag }}.apk`.
          files: openchat-*.apk
          draft: ${{ inputs.ref == '' }}
          prerelease: false

      # GitHub tags a draft only once it is published. The tag goes in now, and last: it is what
      # tells later pushes to main that this version is released.
      - name: Tag the draft's commit
        if: inputs.ref == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
