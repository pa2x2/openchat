name: release-android

on:
  push:
    tags:
      - "v*"
  # A release that is published as soon as it is built, tagged v<package.json version> at
  # `ref`. A pushed tag still ends as a draft for its notes to be pasted into.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      notes:
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  HUSKY: "0"
  REACT_NATIVE_ARCHITECTURES: arm64-v8a,armeabi-v7a

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # Full history and tags, to compare versionCode with earlier releases.
          fetch-depth: 0

      - name: Resolve the release tag
        id: version
        env:
          CALLED_REF: ${{ inputs.ref }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$CALLED_REF" ]; then
            TAG="v$VERSION"
            if git rev-parse --quiet --verify "refs/tags/$TAG" > /dev/null; then
              echo "::error::$TAG is already released"
              exit 1
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::Tag $TAG does not match package.json version $VERSION (expected v$VERSION)"
              exit 1
            fi
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version $VERSION is not semver X.Y.Z or X.Y.Z-prerelease"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check versionCode increased
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          version_code() {
            git show "$1:package.json" 2>/dev/null | node -e '
              let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
                try { console.log(JSON.parse(s).versionCode ?? 0); } catch { console.log(0); }
              });'
          }
          CURRENT=$(node -p "require('./package.json').versionCode")
          if ! echo "$CURRENT" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::package.json versionCode must be a positive integer, got $CURRENT"
            exit 1
          fi
          for TAG in $(git tag --list 'v*'); do
            [ "$TAG" = "$RELEASE_TAG" ] && continue
            PREVIOUS=$(version_code "$TAG")
            if [ "$PREVIOUS" -ge "$CURRENT" ]; then
              echo "::error::versionCode $CURRENT must be greater than $PREVIOUS from $TAG"
              exit 1
            fi
          done
          echo "versionCode $CURRENT"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: temurin

      # Read-only (the default off main): a tag run can only read its own caches and main's,
      # and every release has a new tag, so anything saved here would never be restored.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: android
          save: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint and test
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Decode signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for NAME in SIGNING_KEY KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [ -z "${!NAME}" ]; then
              echo "::error::Repository secret $NAME is not set"
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Generate native project
        run: pnpm exec expo prebuild --platform android --clean --no-install

      # Keep the flags and launcher env in sync with build.yml, or this build misses the caches
      # that runs on main leave behind.
      - name: Build
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -PreactNativeArchitectures="$REACT_NATIVE_ARCHITECTURES"
          -PreactNativeDevServerIp=localhost
          -x lintVitalRelease

      - name: Rename APKs and verify signatures
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -e
          OUT=android/app/build/outputs/apk/release
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"

          mv "$OUT/app-universal-release.apk" "openchat-$TAG.apk"
          for APK in "$OUT"/app-*-release.apk; do
            ABI="$(basename "$APK" -release.apk)"
            mv "$APK" "openchat-${ABI#app-}-$TAG.apk"
          done

          for APK in openchat-*.apk; do
            CERTS=$("$APKSIGNER" verify --print-certs "$APK")
            if echo "$CERTS" | grep -q "CN=Android Debug"; then
              echo "::error::$APK is signed with the debug key"
              exit 1
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          # Creates the tag when the workflow was called; a pushed tag already exists.
          target_commitish: ${{ inputs.ref }}
          body: |
            ${{ inputs.notes || format('Release {0}', steps.version.outputs.tag) }}

            > [!TIP]
            >
            > If you are unsure which version to download, use `openchat-${{ steps.version.outputs.tag }}.apk`.
          files: openchat-*.apk
          draft: ${{ inputs.ref == '' }}
          prerelease: false
