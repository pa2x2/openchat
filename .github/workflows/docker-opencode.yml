name: docker-opencode

# Publishes the server image whenever what goes into it changes on main. The tag follows from
# the repo: the OpenCode version for the first image of that version, then <version>-2,
# <version>-3 and so on for later changes to the config or prompts.

on:
  push:
    branches:
      - main
    paths:
      - docker/opencode/Dockerfile
      - docker/opencode/opencode.json
      - docker/opencode/prompts/**
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    outputs:
      opencode_version:
        value: ${{ jobs.build.outputs.opencode_version }}

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Merging an OpenCode bump starts this twice, by the push and by release-opencode-bump.yml.
    # Queued behind each other, the second run finds the tag the first one made and skips.
    concurrency:
      group: docker-opencode
      cancel-in-progress: false
    outputs:
      opencode_version: ${{ steps.versions.outputs.client }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Full history and tags, to find the images already published for this version.
          fetch-depth: 0

      - name: Derive versions
        id: versions
        run: |
          CLIENT_VERSION=$(node -p "require('./package.json').dependencies['@opencode/client']")
          DOCKER_ARG=$(sed -n 's/^ARG OPENCODE_VERSION=//p' docker/opencode/Dockerfile)
          echo "client=$CLIENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "docker_arg=$DOCKER_ARG" >> "$GITHUB_OUTPUT"

      - name: Check server version matches app client
        run: |
          if [ "${{ steps.versions.outputs.client }}" != "${{ steps.versions.outputs.docker_arg }}" ]; then
            echo "::error::Dockerfile OPENCODE_VERSION (${{ steps.versions.outputs.docker_arg }}) != package.json @opencode/client (${{ steps.versions.outputs.client }})"
            exit 1
          fi

      - name: Pick image tag
        id: tag
        env:
          VERSION: ${{ steps.versions.outputs.client }}
        run: |
          PREFIX="server-opencode-$VERSION"
          COUNT=0
          LATEST=""
          for TAG in $(git tag --list "$PREFIX*"); do
            SUFFIX="${TAG#"$PREFIX"}"
            case "$SUFFIX" in
              "") NUMBER=1 ;;
              -*[!0-9]*) continue ;;
              -?*) NUMBER="${SUFFIX#-}" ;;
              *) continue ;;
            esac
            if [ "$NUMBER" -gt "$COUNT" ]; then
              COUNT=$NUMBER
              LATEST=$TAG
            fi
          done

          if [ "$COUNT" -eq 0 ]; then
            IMAGE_TAG="$VERSION"
          elif git diff --quiet "$LATEST" HEAD -- \
            docker/opencode/Dockerfile docker/opencode/opencode.json docker/opencode/prompts; then
            echo "$LATEST already holds this image."
            exit 0
          else
            IMAGE_TAG="$VERSION-$((COUNT + 1))"
          fi
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Compute image name
        id: meta
        if: steps.tag.outputs.image_tag
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/openchat-opencode"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags=$IMAGE:${{ steps.tag.outputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.tag.outputs.image_tag
      - uses: docker/setup-buildx-action@v3
        if: steps.tag.outputs.image_tag

      - name: Log in to GHCR
        if: steps.tag.outputs.image_tag
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        if: steps.tag.outputs.image_tag
        uses: docker/build-push-action@v6
        with:
          context: docker/opencode
          file: docker/opencode/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            OPENCODE_VERSION=${{ steps.versions.outputs.client }}

      - name: Create GitHub Release
        if: steps.tag.outputs.image_tag
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: server-opencode-${{ steps.tag.outputs.image_tag }}
          name: server-opencode-${{ steps.tag.outputs.image_tag }}
          target_commitish: ${{ inputs.ref || github.sha }}
          body: |
            Release server-opencode-${{ steps.tag.outputs.image_tag }}

            Docker image: `${{ steps.meta.outputs.tags }}`
            Digest: `${{ steps.build.outputs.digest }}`

            ```sh
            docker pull ${{ steps.meta.outputs.tags }}
            ```
          draft: false
          prerelease: false
          # Keep the app's Android release as "Latest"; server releases get no label.
          make_latest: false
