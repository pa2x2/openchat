<!--
  App icon glyph: a chat bubble with a ">_" prompt cut out.
  Drawn on the 108dp Android adaptive-icon canvas; everything stays inside the
  66dp safe zone (r=33 around 54,54) so no launcher mask can clip it.
  Solid white on transparent so it doubles as the themed-icon monochrome layer,
  which Android reads as an alpha mask. scripts/generate-icons.sh recolours it
  for the splash screen.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <mask id="prompt" maskUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
    <path fill="#fff" d="M47.45 69.42 A20.24 20.24 0 1 0 37.66 59.63 Q35.82 66.99 33 75 Q41.93 71.26 47.45 69.42 Z"/>
    <path fill="none" stroke="#000" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" d="M45.88 43.72 L53.24 51.08 L45.88 58.44 M57.84 58.44 H67.04"/>
  </mask>
  <rect width="108" height="108" fill="#ffffff" mask="url(#prompt)"/>
</svg>
