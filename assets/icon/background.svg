<!-- Adaptive-icon background layer: the palette's primary blue as a diagonal gradient. -->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4b8ffa"/>
    <stop offset="1" stop-color="#1f5eb4"/>
  </linearGradient>
  <rect width="108" height="108" fill="url(#bg)"/>
</svg>
