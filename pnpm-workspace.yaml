allowBuilds:
  husky: true
  msgpackr-extract: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@opencode/client@2.0.7"
  - "@opencode/protocol@2.0.7"
  - "@opencode/schema@2.0.7"
packageExtensions:
  # Its math renderer needs this native module; OpenChat only uses the
  # headless parser, so keep it out of the install and the app build.
  react-native-nitro-markdown:
    peerDependenciesMeta:
      ratex-react-native:
        optional: true
