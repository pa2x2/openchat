allowBuilds:
  husky: true
  msgpackr-extract: true
  unrs-resolver: true
packageExtensions:
  # Only its opt-in bundle mode needs a Metro config, and nothing in it imports
  # this. As a required peer it gets auto-installed at the newest version, which
  # React Native's CLI plugin then shares although it wants its own version.
  react-native-worklets:
    peerDependenciesMeta:
      "@react-native/metro-config":
        optional: true
