allowBuilds:
  husky: true
  msgpackr-extract: true
  unrs-resolver: true
packageExtensions:
  # Its math renderer needs this native module; OpenChat only uses the
  # headless parser, so keep it out of the install and the app build.
  react-native-nitro-markdown:
    peerDependenciesMeta:
      ratex-react-native:
        optional: true
